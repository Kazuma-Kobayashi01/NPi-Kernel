# Bot-only forwarding resolver. TLS bypasses the host proxy's fake-IP DNS interception.
server:
    interface: 172.30.0.1
    access-control: 172.30.0.0/24 allow
    access-control: 127.0.0.0/8 allow
    do-ip6: no
    username: "unbound"
    chroot: ""
    tls-cert-bundle: "/etc/ssl/certs/ca-certificates.crt"
    # Cloudflare validates DNSSEC upstream; this instance only forwards over authenticated TLS.
    module-config: "iterator"
    hide-identity: yes
    hide-version: yes
    prefetch: yes
forward-zone:
    name: "."
    forward-tls-upstream: yes
    forward-addr: 1.1.1.1@853#cloudflare-dns.com
    forward-addr: 1.0.0.1@853#cloudflare-dns.com
