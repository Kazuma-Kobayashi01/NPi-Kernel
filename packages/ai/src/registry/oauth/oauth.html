<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="dark light" />
		<title>NPi · Sign in</title>
		<style>
			:root {
				--bg: #000;
				--card: #0b0b0d;
				--ink-1: #f4f4f5;
				--ink-2: #b4b4bb;
				--ink-3: #7a7a83;
				--line-1: rgb(255 255 255 / 0.07);
				--line-2: rgb(255 255 255 / 0.12);
				--top-lit: rgb(255 255 255 / 0.22);
				--accent-a: #22d3ee;
				--accent-b: #f472b6;
				--accent-gradient: linear-gradient(135deg, var(--accent-a), var(--accent-b));
				--ok: #4ade80;
				--ok-soft: rgb(74 222 128 / 0.12);
				--bad: #f87171;
				--bad-soft: rgb(248 113 113 / 0.12);
				--pending: #a1a1aa;
				--pending-soft: rgb(161 161 170 / 0.12);
				--glow-a: rgb(34 211 238 / 0.1);
				--glow-b: rgb(244 114 182 / 0.08);
				--shadow: 0 30px 60px -20px rgb(0 0 0 / 0.8);
				--btn-bg: #f4f4f5;
				--btn-fg: #000;
				--r-control: 8px;
				--r-panel: 16px;
				--sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
				--mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
				color-scheme: dark;
			}

			@media (prefers-color-scheme: light) {
				:root {
					--bg: #fafafa;
					--card: #fff;
					--ink-1: #111113;
					--ink-2: #4b4b52;
					--ink-3: #83838b;
					--line-1: rgb(0 0 0 / 0.08);
					--line-2: rgb(0 0 0 / 0.12);
					--top-lit: rgb(0 0 0 / 0.04);
					--accent-a: #0891b2;
					--accent-b: #db2777;
					--ok: #16a34a;
					--ok-soft: rgb(22 163 74 / 0.1);
					--bad: #dc2626;
					--bad-soft: rgb(220 38 38 / 0.1);
					--pending: #71717a;
					--pending-soft: rgb(113 113 122 / 0.1);
					--glow-a: rgb(8 145 178 / 0.08);
					--glow-b: rgb(219 39 119 / 0.06);
					--shadow: 0 20px 50px -24px rgb(0 0 0 / 0.18);
					--btn-bg: #111113;
					--btn-fg: #fff;
					color-scheme: light;
				}
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 1.5rem;
				font-family: var(--sans);
				background: var(--bg);
				color: var(--ink-1);
				-webkit-font-smoothing: antialiased;
				overflow-x: clip;
			}

			/* ambient glow */
			.glow {
				position: fixed;
				inset: 0;
				pointer-events: none;
				background:
					radial-gradient(ellipse 50vw 40vh at 38% 30%, var(--glow-a), transparent 70%),
					radial-gradient(ellipse 50vw 40vh at 64% 64%, var(--glow-b), transparent 70%);
			}

			.container {
				position: relative;
				width: 100%;
				max-width: 400px;
				padding: 2rem 2rem 1.75rem;
				background: var(--card);
				border: 1px solid var(--line-1);
				border-radius: var(--r-panel);
				box-shadow: var(--shadow);
				overflow: hidden;
				animation: rise 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
			}
			/* top-lit hairline */
			.container::before {
				content: "";
				position: absolute;
				top: 0;
				left: 12%;
				right: 12%;
				height: 1px;
				background: linear-gradient(90deg, transparent, var(--top-lit), transparent);
			}
			@keyframes rise {
				from {
					opacity: 0;
					transform: translateY(8px);
				}
			}

			.brand {
				display: flex;
				align-items: center;
				gap: 0.6rem;
				margin-bottom: 1.75rem;
			}
			.npi-mark {
				flex: none;
				display: block;
				color: var(--ink-1);
			}
			.wordmark {
				font-size: 13px;
				font-weight: 600;
				letter-spacing: -0.01em;
			}
			.wordmark-sub {
				margin-left: auto;
				font-family: var(--mono);
				font-size: 12px;
				color: var(--ink-3);
			}

			.status {
				display: inline-flex;
				align-items: center;
				gap: 0.45rem;
				padding: 0.22rem 0.6rem 0.22rem 0.5rem;
				margin-bottom: 1rem;
				border-radius: 999px;
				font-size: 12px;
				font-weight: 500;
				color: var(--pending);
				background: var(--pending-soft);
			}
			.status-dot {
				width: 7px;
				height: 7px;
				border-radius: 50%;
				background: currentColor;
			}
			.status-word {
				display: none;
			}
			.container:not(.success):not(.error) .status-pending,
			.success .status-success,
			.error .status-error {
				display: inline;
			}
			.container:not(.success):not(.error) .status-dot {
				animation: pulse 1.4s ease-in-out infinite;
			}
			@keyframes pulse {
				50% {
					opacity: 0.35;
				}
			}
			.success .status {
				color: var(--ok);
				background: var(--ok-soft);
			}
			.error .status {
				color: var(--bad);
				background: var(--bad-soft);
			}

			h1 {
				margin: 0 0 0.5rem;
				font-size: 1.35rem;
				font-weight: 600;
				letter-spacing: -0.02em;
				line-height: 1.25;
				text-wrap: balance;
			}
			p {
				margin: 0 0 1.5rem;
				font-size: 0.9rem;
				line-height: 1.6;
				color: var(--ink-2);
			}
			p:last-of-type:not(:has(+ .btn)) {
				margin-bottom: 0.25rem;
			}
			.error p {
				font-family: var(--mono);
				font-size: 0.8rem;
				padding: 0.6rem 0.75rem;
				border: 1px solid var(--line-1);
				border-radius: var(--r-control);
				overflow-wrap: anywhere;
			}

			.btn {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				width: 100%;
				padding: 0.6rem 1rem;
				font: inherit;
				font-size: 0.875rem;
				font-weight: 500;
				color: var(--btn-fg);
				background: var(--btn-bg);
				border: none;
				border-radius: var(--r-control);
				cursor: pointer;
				transition: opacity 0.15s;
			}
			.btn:hover {
				opacity: 0.86;
			}
			.btn:focus-visible {
				outline: 2px solid var(--accent-a);
				outline-offset: 2px;
			}
			.error .btn {
				color: var(--ink-1);
				background: transparent;
				border: 1px solid var(--line-2);
			}

			/* auto-close progress */
			.timer {
				position: absolute;
				left: 0;
				bottom: 0;
				height: 2px;
				width: 100%;
				background: var(--accent-gradient);
				transform-origin: left;
				transform: scaleX(0);
			}
			.countdown .timer {
				animation: countdown 3s linear forwards;
			}
			@keyframes countdown {
				from {
					transform: scaleX(1);
				}
				to {
					transform: scaleX(0);
				}
			}

			@media (prefers-reduced-motion: reduce) {
				.container,
				.countdown .timer,
				.status-dot {
					animation: none !important;
				}
			}
		</style>
	</head>
	<body>
		<span aria-hidden="true" class="glow"></span>
		<div id="app" class="container">
			<div class="brand">
				<svg class="npi-mark" viewBox="100 108 312 272" width="24" height="21" fill="currentColor" aria-hidden="true">
					<rect x="116" y="116" width="280" height="14" />
					<rect x="136" y="136" width="240" height="34" />
					<rect x="158" y="169" width="48" height="11" />
					<polygon points="162,179 202,179 195,192 169,192" />
					<polygon points="169,191 195,191 199,343 165,343" />
					<rect x="156" y="341" width="52" height="14" />
					<rect x="306" y="169" width="48" height="11" />
					<polygon points="310,179 350,179 343,192 317,192" />
					<polygon points="317,191 343,191 347,343 313,343" />
					<rect x="304" y="341" width="52" height="14" />
					<rect x="124" y="353" width="264" height="10" />
					<rect x="104" y="361" width="304" height="11" />
					<circle cx="256" cy="272" r="15" />
				</svg>
				<span class="wordmark">NPi</span>
				<span class="wordmark-sub" id="sub">sign in</span>
			</div>

			<div class="status" role="status">
				<span aria-hidden="true" class="status-dot"></span>
				<span class="status-word status-pending">Waiting</span>
				<span class="status-word status-success">Connected</span>
				<span class="status-word status-error">Failed</span>
			</div>

			<h1 id="title">Signing in…</h1>
			<p id="message"></p>
			<button onclick="window.close()" class="btn">Close this tab</button>
			<span aria-hidden="true" class="timer"></span>
		</div>

		<script id="server-state" type="application/json">
			__OAUTH_STATE__
		</script>

		<script>
			let serverState;
			try {
				serverState = JSON.parse(document.getElementById("server-state").textContent);
			} catch {
				const params = new URLSearchParams(window.location.search);
				serverState = {
					ok: params.get("ok") === "1",
					error: params.get("error") || "Authentication failed",
				};
			}

			// Chinese copy when the browser asks for it; English otherwise.
			const zh = typeof navigator !== "undefined" && /^zh\b/i.test(navigator.language || "");
			const copy = zh
				? {
						sub: "登录",
						statuses: ["等待中", "已连接", "失败"],
						button: "关闭此页",
						okTitle: "登录成功",
						okMessage: "账号已连接，回到 NPi 即可继续。",
						okManual: "账号已连接，回到 NPi 即可继续。<br>此页可以手动关闭。",
						failTitle: "登录失败",
						failMessage: "发生未知错误",
					}
				: {
						sub: "sign in",
						statuses: ["Waiting", "Connected", "Failed"],
						button: "Close this tab",
						okTitle: "You're signed in",
						okMessage: "Your account is connected. Head back to NPi to continue.",
						okManual: "Your account is connected. Head back to NPi to continue.<br>You can close this tab.",
						failTitle: "Sign-in failed",
						failMessage: "An error occurred",
					};

			const app = document.getElementById("app");
			const title = document.getElementById("title");
			const message = document.getElementById("message");
			const closeButton = document.querySelector(".btn");
			document.getElementById("sub").textContent = copy.sub;
			document.querySelectorAll(".status-word").forEach((el, i) => {
				el.textContent = copy.statuses[i];
			});
			closeButton.textContent = copy.button;

			if (serverState.ok) {
				app.classList.add("success", "countdown");
				title.textContent = copy.okTitle;
				message.textContent = copy.okMessage;
				window.close();
				setTimeout(() => {
					app.classList.remove("countdown");
					closeButton.remove();
					message.innerHTML = copy.okManual;
				}, 300);
			} else {
				app.classList.add("error");
				title.textContent = copy.failTitle;
				message.textContent = serverState.error || copy.failMessage;
			}
		</script>
	</body>
</html>
